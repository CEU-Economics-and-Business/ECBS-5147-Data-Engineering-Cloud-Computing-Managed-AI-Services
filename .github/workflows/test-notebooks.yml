name: Test Notebooks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    if: github.repository == 'CEU-Economics-and-Business/ECBS-5147-Data-Engineering-Cloud-Computing-Managed-AI-Services'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/zoltanctoth/ceu-cloud-class:latest
      options: --user root

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate RSA keypair for tests
        # Same command students run (encryption/create_public_key.md)
        run: ssh-keygen -t rsa -f my_keypair -N ''

      - name: Run pytest
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
        run: uv run --frozen pytest tests/test_notebooks.py -v
